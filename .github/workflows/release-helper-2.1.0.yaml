name: Temporary v2.1.0 release helper

on:
  push:
    branches:
      - release-helper/2.1.0

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create release tag at frozen commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref='refs/tags/release/2.1.0' \
            -f sha='5b410cef4328caa56a56fff41c1a7b27d35418c5'

      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: release/2.1.0
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Verify release version
        run: |
          ./gradlew properties | grep '^version: 2.1.0$'

      - name: Publish package to Maven Central
        run: ./gradlew publishToMavenCentral
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.ORG_GRADLE_PROJECT_MAVENCENTRALUSERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.ORG_GRADLE_PROJECT_MAVENCENTRALPASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.ORG_GRADLE_PROJECT_SIGNINGINMEMORYKEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.ORG_GRADLE_PROJECT_SIGNINGINMEMORYKEYPASSWORD }}

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/release-notes.md <<'EOF'
          ## New features and improvements

          * Add Kubernetes 1.35.0 support for KindContainer by @dajudge in https://github.com/dajudge/kindcontainer/pull/425
          * Add Kubernetes 1.35.0 support for ApiServerContainer by @dajudge in https://github.com/dajudge/kindcontainer/pull/426
          * Add K3s 1.35.0 support by @dajudge in https://github.com/dajudge/kindcontainer/pull/427
          * Add Kubernetes 1.36.1 support for KindContainer by @dajudge in https://github.com/dajudge/kindcontainer/pull/478
          * Add K3s 1.36.1 support by @dajudge in https://github.com/dajudge/kindcontainer/pull/479
          * Add Kubernetes 1.36.1 support for ApiServerContainer by @dajudge in https://github.com/dajudge/kindcontainer/pull/480

          ## Dependency updates

          * Bump org.mockito:mockito-core from 5.20.0 to 5.21.0 by @dependabot[bot] in https://github.com/dajudge/kindcontainer/pull/417
          * Bump ch.qos.logback:logback-classic from 1.5.19 to 1.5.22 by @dependabot[bot] in https://github.com/dajudge/kindcontainer/pull/418
          * Bump testcontainersVersion from 2.0.2 to 2.0.3 by @dependabot[bot] in https://github.com/dajudge/kindcontainer/pull/423
          * Bump ch.qos.logback:logback-classic from 1.5.22 to 1.5.23 by @dependabot[bot] in https://github.com/dajudge/kindcontainer/pull/428
          * Bump ch.qos.logback:logback-classic from 1.5.23 to 1.5.24 by @dependabot[bot] in https://github.com/dajudge/kindcontainer/pull/432
          * Bump com.vanniktech.maven.publish from 0.35.0 to 0.36.0 by @dependabot[bot] in https://github.com/dajudge/kindcontainer/pull/435
          * Bump org.junit.platform:junit-platform-launcher from 6.0.1 to 6.0.3 by @dependabot[bot] in https://github.com/dajudge/kindcontainer/pull/447
          * Bump io.fabric8:kubernetes-client from 7.4.0 to 7.6.1 by @dependabot[bot] in https://github.com/dajudge/kindcontainer/pull/452
          * Bump org.mockito:mockito-core from 5.21.0 to 5.23.0 by @dependabot[bot] in https://github.com/dajudge/kindcontainer/pull/453
          * Bump gradle-wrapper from 9.2.1 to 9.4.1 by @dependabot[bot] in https://github.com/dajudge/kindcontainer/pull/454
          * Bump testcontainersVersion from 2.0.3 to 2.0.4 by @dependabot[bot] in https://github.com/dajudge/kindcontainer/pull/455
          * Bump org.bouncycastle:bcpkix-jdk18on from 1.83 to 1.84 by @dependabot[bot] in https://github.com/dajudge/kindcontainer/pull/456
          * Bump testcontainersVersion from 2.0.4 to 2.0.5 by @dependabot[bot] in https://github.com/dajudge/kindcontainer/pull/457
          * Bump org.slf4j:slf4j-api from 2.0.17 to 2.0.18 by @dependabot[bot] in https://github.com/dajudge/kindcontainer/pull/461
          * Bump com.vanniktech.maven.publish from 0.36.0 to 0.37.0 by @dependabot[bot] in https://github.com/dajudge/kindcontainer/pull/467
          * Bump io.fabric8:kubernetes-client from 7.6.1 to 7.8.0 by @dependabot[bot] in https://github.com/dajudge/kindcontainer/pull/472
          * Bump ch.qos.logback:logback-classic from 1.5.24 to 1.5.38 by @dependabot[bot] in https://github.com/dajudge/kindcontainer/pull/474
          * Bump junitVersion from 5.11.4 to 6.1.3 by @dependabot[bot] in https://github.com/dajudge/kindcontainer/pull/475
          * Bump org.junit.platform:junit-platform-launcher from 6.0.3 to 6.1.2 by @dependabot[bot] in https://github.com/dajudge/kindcontainer/pull/476
          * Bump org.bouncycastle:bcpkix-jdk18on from 1.84 to 1.85 by @dependabot[bot] in https://github.com/dajudge/kindcontainer/pull/477
          * Bump org.junit.platform:junit-platform-launcher from 6.1.2 to 6.1.3 by @dependabot[bot] in https://github.com/dajudge/kindcontainer/pull/483
          * Bump gradle-wrapper from 9.4.1 to 9.7.0 by @dependabot[bot] in https://github.com/dajudge/kindcontainer/pull/484
          * Bump gradle-wrapper from 9.7.0 to 9.7.1 by @dependabot[bot] in https://github.com/dajudge/kindcontainer/pull/488

          ## Housekeeping

          * Fix README for 2.0.0 release by @dajudge in https://github.com/dajudge/kindcontainer/pull/412
          * Update actions/checkout to v4 by @dajudge in https://github.com/dajudge/kindcontainer/pull/413
          * Update actions/setup-java to v4 by @dajudge in https://github.com/dajudge/kindcontainer/pull/414
          * Replace deprecated set-output with GITHUB_OUTPUT by @dajudge in https://github.com/dajudge/kindcontainer/pull/415
          * Update Java distribution to temurin by @dajudge in https://github.com/dajudge/kindcontainer/pull/416
          * Remove unnecessary MIT license header from K3sContainer by @dajudge in https://github.com/dajudge/kindcontainer/pull/421

          **Full Changelog**: https://github.com/dajudge/kindcontainer/compare/release/2.0.0...release/2.1.0
          EOF
          sed -i 's/^          //' /tmp/release-notes.md
          gh release create release/2.1.0 \
            --title 'v2.1.0' \
            --notes-file /tmp/release-notes.md \
            --verify-tag
