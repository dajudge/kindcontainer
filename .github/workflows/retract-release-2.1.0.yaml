name: Temporary v2.1.0 release retraction helper

on:
  push:
    branches:
      - release-cleanup/2.1.0

permissions:
  contents: write

jobs:
  retract:
    runs-on: ubuntu-latest
    steps:
      - name: Retract GitHub release but keep tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete release/2.1.0 --repo "$GITHUB_REPOSITORY" --yes
