name: Finalize v2.1.0 GitHub release

on:
  push:
    branches:
      - release-finalize/2.1.0

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create release/2.1.0 --repo "$GITHUB_REPOSITORY" --title 'v2.1.0' --notes-file .release-notes-2.1.0.md --verify-tag
