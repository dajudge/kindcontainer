name: CI Build

on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: set-matrix
        run: |
          matrix=$( cat k8s-versions.json | jq '{version: [keys[] as $k | .[$k].versions[] | .k8s as $v | "\($k) \($v)"]}' -c )
          echo $matrix
          echo "matrix=$matrix" >> $GITHUB_OUTPUT

  check-matrix:
    runs-on: ubuntu-latest
    needs: matrix
    steps:
      - name: Check matrix definition
        run: |
          matrix='${{ needs.matrix.outputs.matrix }}'
          echo $matrix
          echo $matrix | jq .

  build:
    runs-on: ubuntu-latest
    needs: matrix
    strategy:
      matrix: ${{ fromJson(needs.matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build with Gradle
        env:
          CONTAINER_FILTER: ${{ matrix.version }}
        run: ./gradlew build
      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.version }}
          path: |
            build/reports/tests/test/
            build/test-results/test/
          if-no-files-found: ignore
          retention-days: 7
      - name: Capture runner diagnostics
        if: failure()
        run: |
          {
            echo '=== timestamp ==='
            date -u
            echo '=== uptime/load ==='
            uptime
            echo '=== memory ==='
            free -h
            echo '=== disk ==='
            df -h
            echo '=== docker info ==='
            docker info
            echo '=== docker disk usage ==='
            docker system df
            echo '=== docker containers ==='
            docker ps -a
            echo '=== docker resource usage ==='
            docker stats --no-stream
          } > runner-diagnostics.txt 2>&1 || true
          cat runner-diagnostics.txt
      - name: Upload runner diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: runner-diagnostics-${{ strategy.job-index }}
          path: runner-diagnostics.txt
          retention-days: 7
